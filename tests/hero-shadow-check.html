<!doctype html><meta charset="utf-8"><title>v217 第一人称固定阴影检查</title>
<style>body{background:#172229;color:#e5eee9;font:14px system-ui;margin:18px}button,select{font:inherit;margin:5px;padding:6px}#images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0}img{width:100%;display:block}pre{white-space:pre-wrap}canvas{max-width:100%}</style>
<h1>第一人称 · 固定光照和遮挡</h1>
<p>采用实际英雄、武器和持握模块。标准片隔离阴影影响，树冠选项使用游戏原树木与叶片材质；仍需真实地图回归。相同镜头分别对比旧行为（不接收阴影）与新行为；不添加第一人称灯光或自投影。</p>
<select id="size"><option value="desktop">电脑 960×540</option><option value="mobile">手机尺寸 844×390（非真机）</option></select>
<select id="occluder"><option value="card">标准遮挡片</option><option value="tree">实际森林树冠</option></select>
<button id="capture" disabled>生成七英雄前后对照</button><p id="status">载入角色</p><div id="live"></div><div id="images"></div><pre id="report"></pre>
<script type="module">
import * as T from '../vendor/three.module.js';
import {snapShadowFocus} from '../shadow-stability.js';
const main=await(await fetch('../main.js',{cache:'no-store'})).text(),worldText=await(await fetch('../world.js',{cache:'no-store'})).text();
const moduleEntry=(text,name)=>text.match(new RegExp("from[\\s]*['\"](\\./"+name+"\\.js[^'\"]*)['\"]"))[1];
const {FirstPersonView}=await import(new URL('../'+moduleEntry(main,'first-person-view'),location.href));
const {addTree,loadTreeTextures}=await import(new URL('../'+moduleEntry(main,'tree-scenery'),location.href));
const {loadHeroAssets,createSkinnedHero,animateSkinnedHero,disposeHero}=await import(new URL('../'+moduleEntry(worldText,'skinned-hero'),location.href));
const errors=[];addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const originalError=console.error.bind(console);console.error=(...args)=>{errors.push(args.map(String).join(' '));originalError(...args);};
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(960,540);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.type=T.PCFSoftShadowMap;
document.querySelector('#live').append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x8fa99d);
const camera=new T.PerspectiveCamera(70,960/540,.1,80);camera.position.set(0,1.6,0);scene.add(camera);
const hemi=new T.HemisphereLight(0x91b6cd,0x657560,1.12),sun=new T.DirectionalLight(0xffdfa8,3.25),rim=new T.DirectionalLight(0x99b8c0,.58),direction=new T.Vector3(-18,30,14).normalize();
sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:.5,far:80});sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.00025;sun.shadow.normalBias=.018;sun.shadow.intensity=.9;
snapShadowFocus(sun.target.position,direction,sun.shadow.camera,sun.shadow.mapSize);sun.position.copy(sun.target.position).addScaledVector(direction,38);rim.position.set(-10,10,-15);
for(const light of[hemi,sun,rim])light.layers.enable(1);scene.add(hemi,sun,sun.target,rim);
const floor=new T.Mesh(new T.PlaneGeometry(60,60),new T.MeshStandardMaterial({color:0x556858,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const canopy=new T.Mesh(new T.PlaneGeometry(7,7),new T.MeshStandardMaterial({color:0x304a37,roughness:1,side:T.DoubleSide}));canopy.rotation.x=-Math.PI/2;canopy.position.set(-1,3.5,0);canopy.castShadow=true;scene.add(canopy);
const tree=new T.Group();tree.position.set(-2.1,0,1.3);addTree(tree,'forest',.7,{angle:.9,variation:1});tree.visible=false;scene.add(tree);
const view=new FirstPersonView(camera),button=document.querySelector('#capture'),status=document.querySelector('#status'),images=document.querySelector('#images'),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const roster=[['scout','rifle'],['silver','crossbow'],['wraith','shadowblade'],['tide','harpoon'],['lingya','boomerang'],['wuling','sporelantern'],['mirage','miasmalantern']];
await Promise.all([loadHeroAssets(),loadTreeTextures()]);button.disabled=false;status.textContent='资源已就绪';
const paint=()=>{renderer.shadowMap.needsUpdate=true;renderer.render(scene,camera);view.render(renderer,scene);};
function capture(kind,mode){
 paint();ctx.drawImage(renderer.domElement,0,0);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
 const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=canvas.toDataURL('image/png');img.id=`shadow-${kind}-${mode}`;img.dataset.kind=kind;img.dataset.mode=mode;caption.textContent=kind+' · '+(mode==='before'?'旧：不接收世界阴影':'新：接收已有世界阴影');figure.append(img,caption);images.append(figure);return pixels;
}
button.onclick=async()=>{
 button.disabled=true;images.replaceChildren();const reports=[],startErrors=errors.length,mobile=document.querySelector('#size').value==='mobile',[width,height]=mobile?[844,390]:[960,540];
 const occluder=document.querySelector('#occluder').value;tree.visible=occluder==='tree';canopy.visible=!tree.visible;
 renderer.setSize(width,height);canvas.width=width;canvas.height=height;camera.aspect=width/height;camera.updateProjectionMatrix();sun.shadow.mapSize.set(mobile?1024:1536,mobile?1024:1536);sun.shadow.map?.dispose();sun.shadow.map=null;snapShadowFocus(sun.target.position,direction,sun.shadow.camera,sun.shadow.mapSize);sun.position.copy(sun.target.position).addScaledVector(direction,38);
 let hero;
 try{for(const[kind,weapon]of roster){
  status.textContent='检查 '+kind;hero=createSkinnedHero(kind,weapon);animateSkinnedHero(hero,0,0,0,0);view.setHero(hero,weapon);Object.assign(hero.userData,{attackAge:10,reloadDuration:1,reloadPhase:1});view.update(0,1/60,{visible:true,yaw:0,pitch:0});scene.updateMatrixWorld(true);
  const receivers=[];view.root.traverse(o=>{if(o.isMesh){if(o.castShadow)throw Error('新增自投影 '+o.name);receivers.push(o);o.receiveShadow=false;}});
  await renderer.compileAsync(scene,camera);const before=capture(kind,'before');for(const mesh of receivers)mesh.receiveShadow=true;const after=capture(kind,'after');
  let changed=0,delta=0,brightened=0;for(let i=0;i<before.length;i+=4){const a=before[i]*.2126+before[i+1]*.7152+before[i+2]*.0722,b=after[i]*.2126+after[i+1]*.7152+after[i+2]*.0722;if(Math.abs(a-b)>1){changed++;delta+=a-b;if(b>a+2)brightened++;}}
  const gl=renderer.getContext(),error=gl.getError(),report={kind,weapon,receivers:receivers.length,changedPixels:changed,meanDarkening:changed?delta/changed:0,brightenedPixels:brightened,glError:error,pass:changed>30&&delta>0&&error===0};reports.push(report);view.clear();disposeHero(hero);hero=null;await new Promise(requestAnimationFrame);
 }}catch(error){errors.push(error.stack||String(error));}finally{if(hero){view.clear();disposeHero(hero);}button.disabled=false;}
 const result={fixture:'actual hero/viewmodel under a fixed shadow caster; visual review still required',occluder,size:[width,height],mobileSimulation:mobile,lights:3,shadowMaps:1,reports,errors:errors.slice(startErrors)};document.querySelector('#report').textContent=JSON.stringify(result,null,2);status.textContent=reports.length===7&&reports.every(r=>r.pass)&&!result.errors.length?'PASS · 七英雄世界阴影接收，请检查图片中的边缘与可读性':'FAIL · 查看报告';
};
</script>
