<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>菌丝长鞭与蚀梦折扇 · 连续动作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#182a30;color:#e5eee7;font:14px system-ui}header{padding:16px 20px;background:#20353c}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0;line-height:1.5}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.group{display:flex;gap:4px}button{padding:9px 13px;background:#29454d;color:inherit;border:1px solid #648187;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#b7d5b3;color:#152a27;border-color:#cbe5c7}button:disabled{opacity:.45;cursor:wait}#stage{height:min(72vh,780px);min-height:330px;position:relative}canvas{display:block;width:100%;height:100%}#crosshair{position:absolute;left:50%;top:50%;width:12px;height:12px;border:1px solid #d4e8c9;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}footer{padding:10px 20px}#phase{font-variant-numeric:tabular-nums}#progress{height:6px;background:#39545b;border-radius:4px;overflow:hidden;margin:8px 0}#bar{height:100%;width:0;background:#b7d5b3}#error{white-space:pre-wrap;color:#ffd2be}small{color:#b1c8c6}@media(max-width:600px){header{padding:12px}h1{font-size:17px}button{padding:9px}footer{padding:8px 12px}#stage{height:58vh}}
</style>
<header>
 <h1>菌丝长鞭与蚀梦折扇 · 连续动作预览</h1>
 <p>真实游戏模型与双视角动作。开始时静候 2 秒，随后持续出手；可暂停检查掌心、鞭身延迟与折扇收放。</p>
 <div class="controls">
  <div class="group" aria-label="装备"><button data-weapon="mycelialwhip" disabled>雾苓 · 菌丝长鞭</button><button data-weapon="venomfan" disabled>蜃影 · 蚀梦折扇</button></div>
  <div class="group" aria-label="视角"><button data-view="front" disabled>正面全身</button><button data-view="side" disabled>侧面全身</button><button data-view="first" disabled>第一人称</button></div>
  <div class="group" aria-label="路线"><button data-path="" disabled>基础</button><button data-path="tip" disabled>鞭梢凝毒</button><button data-path="sweep" disabled>菌幕横扫</button><button data-path="return" disabled>回岚蚀梦</button><button data-path="fold" disabled>合扇穿瘴</button></div>
  <div class="group" aria-label="播放速度"><button data-speed="slow" disabled>慢放 ×0.35</button><button data-speed="normal" disabled>正常</button><button data-speed="haste" disabled>急速 ×2.5</button></div>
  <div class="group"><button id="pause" disabled>暂停</button><button id="step" disabled>前进一帧</button><button id="restart" disabled>重新开始</button></div>
  <div class="group" aria-label="动作检查"><button data-phase=".10" disabled>蓄势顶点</button><button data-phase="contact" disabled>出手瞬间</button><button data-phase=".90" disabled>回收阶段</button><button id="save" disabled>保存画面</button></div>
 </div>
</header>
<main id="stage"><span id="crosshair" hidden></span></main>
<footer><p id="phase" role="status">正在载入模型与动画…</p><div id="progress"><div id="bar"></div></div><small id="note">无音效，不读取或写入游戏存档。</small><pre id="error" hidden></pre></footer>
<script type="module">
import * as T from '../vendor/three.module.js';
const $=selector=>document.querySelector(selector),errors=[];
function fail(error){errors.push(String(error?.stack||error));$('#error').hidden=false;$('#error').textContent=errors.join('\n');}
addEventListener('error',event=>fail(event.error||event.message));addEventListener('unhandledrejection',event=>fail(event.reason));
try{
 const html=await(await fetch('../index.html',{cache:'no-store'})).text(),version=html.match(/main\.js\?v=([^"']+)/)?.[1];
 if(!version)throw Error('无法读取当前游戏版本。');
 const suffix='?v='+version;
 const [{loadHeroAssets,createSkinnedHero,animateSkinnedHero,disposeHero},{FirstPersonView},{weaponDuration}]=await Promise.all([import('../skinned-hero.js'+suffix),import('../first-person-view.js'+suffix),import('../weapon-performance.js'+suffix)]);
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}),scene=new T.Scene(),camera=new T.PerspectiveCamera(34,1,.02,60);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;$('#stage').append(renderer.domElement);scene.add(camera);scene.background=new T.Color(0x34474e);
 const ambient=new T.HemisphereLight(0xc7d8df,0x52664e,1.65),sun=new T.DirectionalLight(0xffe3c3,3.4),rim=new T.DirectionalLight(0xa5cfe7,1.3);
 sun.position.set(-4,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-3,right:3,top:4,bottom:-3});sun.shadow.normalBias=.012;rim.position.set(4,3,-5);
 for(const light of[ambient,sun,rim]){light.layers.enable(1);scene.add(light);}
 const ground=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:0x536457,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.015;ground.receiveShadow=true;scene.add(ground);
 const grid=new T.GridHelper(20,40,0x799181,0x60776b);grid.position.y=-.01;scene.add(grid);
 await loadHeroAssets();
 const loadouts={mycelialwhip:{kind:'wuling',label:'菌丝长鞭',period:1/1.1,contact:.42},venomfan:{kind:'mirage',label:'蚀梦折扇',period:1/.95,contact:.32}},actors={};
 for(const[id,loadout]of Object.entries(loadouts)){const actor=createSkinnedHero(loadout.kind,id);actor.visible=false;scene.add(actor);actors[id]=actor;}
 const view=new FirstPersonView(camera),state={weapon:'mycelialwhip',path:'',view:'front',speed:'normal',paused:false,elapsed:0,time:0,cycle:0,age:0,period:.25,release:0,version},params=new URLSearchParams(location.search);
 let actor,wallTime=performance.now(),closed=false;
 function frameCamera(){
  const first=state.view==='first',short=false;camera.fov=first?70:34;
  if(first){camera.position.set(0,short?1.2:1.65,0);camera.lookAt(0,camera.position.y,6);}
  else{const center=short?.73:1.07,height=short?2.1:2.95,distance=height/(2*Math.tan(T.MathUtils.degToRad(camera.fov/2)))*Math.max(1,.9/camera.aspect);camera.position.set(state.view==='side'?distance:.12,center+.06,state.view==='side'?.10:distance);camera.lookAt(0,center,0);}
  camera.updateProjectionMatrix();camera.updateMatrixWorld(true);actor.visible=!first;$('#crosshair').hidden=!first;
 }
 function resize(){const bounds=$('#stage').getBoundingClientRect();renderer.setSize(bounds.width,bounds.height,false);camera.aspect=bounds.width/bounds.height;if(actor)frameCamera();}
 function syncControls(){for(const type of['weapon','view','speed','path'])for(const button of document.querySelectorAll('[data-'+type+']'))button.setAttribute('aria-pressed',String(button.dataset[type]===(type==='path'?state.path.replace(/^(mycelialwhip|venomfan)_/,''):state[type])));$('#pause').textContent=state.paused?'继续':'暂停';$('#pause').setAttribute('aria-pressed',String(state.paused));}
 function updateStatus(){
  const initial=state.elapsed<2,loadout=loadouts[state.weapon],phase=initial?'静候 '+(2-state.elapsed).toFixed(2)+' 秒':state.age<state.release?'收臂蓄势':state.age<weaponDuration(state.weapon,state.period)*.78?'甩鞭 / 挥扇':'回到持握姿势';
  $('#phase').textContent=`${loadout.label} · ${phase} · 第 ${state.cycle} 次 · 周期 ${state.period.toFixed(3)} 秒 · 当前 ${state.age.toFixed(3)} 秒`;
  $('#note').textContent=`接触/释放：${state.release.toFixed(3)} 秒；${state.path||'基础动作'}。真实固定长度鞭身 / 褶皱开合折扇。无音效，不写入游戏存档。`;
  $('#bar').style.width=(initial?0:state.age/state.period*100)+'%';
 }
 function render(){frameCamera();renderer.render(scene,camera);if(state.view==='first')view.render(renderer,scene);updateStatus();}
 function advance(dt){
  state.time+=dt;state.elapsed+=dt;const active=state.elapsed>=2,age=Math.max(0,state.elapsed-2),cycle=active?Math.floor(age/state.period)+1:0;state.age=active?age%state.period:0;
  const d=actor.userData,started=cycle!==state.cycle;state.cycle=cycle;Object.assign(d,{aimActive:active,aimAngle:0,aimPitch:0,travelAngle:0,reloadDuration:state.period,reloadPhase:active?state.age/state.period:1,shotSerial:cycle,herbalCombo:Math.max(0,cycle-1)%2,herbalPath:state.path});
  animateSkinnedHero(actor,state.time,0,started?.15:0,0);view.update(state.time,dt,{visible:true,attack:started?.15:0});
 }
 function restart(){state.elapsed=state.cycle=state.age=0;state.period=loadouts[state.weapon].period*(state.speed==='haste'?.4:1);state.release=weaponDuration(state.weapon,state.period)*loadouts[state.weapon].contact;Object.assign(actor.userData,{shotSerial:0,lastShotSerial:0,reloadPhase:1,reloadDuration:state.period,attackAge:10,attackGesture:0,aimActive:false});syncControls();advance(1/120);render();}
 function configure(options={}){
  if(options.weapon!==undefined&&!loadouts[options.weapon])throw Error('未知装备');if(options.view!==undefined&&!['front','side','first'].includes(options.view))throw Error('未知视角');if(options.speed!==undefined&&!['slow','normal','haste'].includes(options.speed))throw Error('未知播放速度');
  const changed=!actor||options.weapon&&options.weapon!==state.weapon,reset=changed||options.path!==undefined||options.speed&&options.speed!==state.speed;
  for(const key of['weapon','view','speed','path','paused'])if(options[key]!==undefined)state[key]=options[key];
  if(changed){for(const cached of Object.values(actors))cached.visible=false;actor=actors[state.weapon];view.setHero(actor,state.weapon);}
  if(reset)restart();else{syncControls();render();}return{...state};
 }
 window.motionPreview={get state(){return{...state,errors:[...errors]};},get hero(){return actor;},get firstPerson(){return view;},get renderer(){return renderer;},configure,restart,advance(seconds){const count=Math.ceil(Math.max(0,seconds)*120);for(let i=0;i<count;i++)advance(seconds/count);render();return{...state};}};
 for(const type of['weapon','view','speed','path'])for(const button of document.querySelectorAll('[data-'+type+']'))button.onclick=()=>{if(type==='path'){const path=button.dataset.path;configure({weapon:['tip','sweep'].includes(path)?'mycelialwhip':['return','fold'].includes(path)?'venomfan':state.weapon,path:path?(['tip','sweep'].includes(path)?'mycelialwhip_':'venomfan_')+path:''});}else configure({[type]:button.dataset[type],...(type==='weapon'?{path:''}:{})});};
 $('#pause').onclick=()=>configure({paused:!state.paused});$('#restart').onclick=restart;$('#step').onclick=()=>{state.paused=true;advance(1/60);syncControls();render();};
 for(const button of document.querySelectorAll('[data-phase]'))button.onclick=()=>{state.paused=true;restart();window.motionPreview.advance(2+weaponDuration(state.weapon,state.period)*(button.dataset.phase==='contact'?loadouts[state.weapon].contact:Number(button.dataset.phase))+1e-6-state.elapsed);syncControls();};
 $('#save').onclick=()=>{render();const link=document.createElement('a');link.download=`${state.weapon}-${state.view}-${state.age.toFixed(3)}.png`;link.href=renderer.domElement.toDataURL('image/png');link.click();};
 addEventListener('resize',resize);resize();configure({weapon:params.get('weapon')||'mycelialwhip',view:params.get('view')||'front',speed:params.get('speed')||'normal',paused:params.has('paused')});document.querySelectorAll('button').forEach(button=>button.disabled=false);
 function loop(now){if(closed)return;const dt=Math.min(.05,Math.max(0,(now-wallTime)/1000));wallTime=now;if(!state.paused){const duration=dt*(state.speed==='slow'?.35:1),steps=Math.max(1,Math.ceil(duration/(1/120)));for(let i=0;i<steps;i++)advance(duration/steps);}render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
 addEventListener('pagehide',()=>{closed=true;view.dispose();for(const cached of Object.values(actors))disposeHero(cached);ground.geometry.dispose();ground.material.dispose();grid.geometry.dispose();grid.material.dispose();renderer.dispose();},{once:true});
}catch(error){fail(error);$('#phase').textContent='预览加载失败，详见下方信息。';}
</script>
</html>
