 $('#status').textContent=results.length===expected&&results.every(r=>r.pass)&&!errors.length?'五图与五境五区 × 双视角 × '+(singleSizeBatch?'当前尺寸':'两种横屏')+'，共 '+expected+' 组通过（不测试离线）。':'环境入口检查存在失败，请查看报告。';
};
$('#creature-near').onclick=()=>{
 if(g.state!=='playing'){if(g.state==='paused')g.resume();else g.start();}
 g.player.inv=9999;g.player.attack=9999;
 // Place real regional actors in an existing clearing; keep the map's assets,
 // lighting and collision obstacles. Only this isolated fixture freezes AI.
 const kinds=['wolf','golem','mushroom'];let spots=null,yaw=0;
 for(let i=0;i<24;i++){
  const angle=i*Math.PI/12,next=kinds.map((kind,j)=>({kind,x:g.player.x+Math.sin(angle+(j-1)*.43)*4.8,z:g.player.z+Math.cos(angle+(j-1)*.43)*4.8}));
  if(next.every(p=>g.world.obstacles.every(o=>Math.hypot(p.x-o.x,p.z-o.z)>o.r+1))){spots=next;yaw=angle;break;}
 }
 assert(spots,'出生点周围没有足够展示空间');
 const enemies=spots.map(p=>{const e=g.spawn(p.kind,p.x,p.z);assert(e,'怪物生成失败');e.speed=0;e.cool=999;return e;});
 g.adventureCamera.yaw=yaw;g.adventureCamera.pitch=-.08;g.setView('first');step(45);
 $('#status').textContent='实际地图怪物近景（测试场景冻结 AI，非难度测试） · '+JSON.stringify({kinds:enemies.map(e=>e.kind),width:win.innerWidth,height:win.innerHeight,...reportFrame()});
};
$('#creature-motion').onclick=async()=>{
 motionButton.disabled=true;$('#status').textContent='实战动作检查进行中';await sleep(0);
 try{
  select($('#map').value,'silver',true);g.setView('first');
  const tracked=[];
  for(const [n,kind]of ['wolf','golem','mushroom','spitter','shaman'].entries())for(let i=0;i<24;i++){
   const a=(n+i)*Math.PI/12,x=g.player.x+Math.sin(a)*7,z=g.player.z+Math.cos(a)*7;
   const e=g.spawn(kind,x,z);if(e){tracked.push({e,x,z});break;}
  }
  assert(tracked.length===5,'未找到五种普通怪物的生成位置');g.spawnBoss();assert(g.boss,'首领无法生成');const bossStart={x:g.boss.x,z:g.boss.z};
  let frames=0;for(let n=0;n<540;n++){if(n%30===0)await sleep(0);step();frames++;for(const {e}of tracked)e.mesh.traverse(o=>assert(o.matrixWorld.elements.every(Number.isFinite),'怪物姿势异常'));}
  assert(g.state==='playing','测试对局意外结束');
  const boss=g.boss;boss.mesh.traverse(o=>assert(o.matrixWorld.elements.every(Number.isFinite),'首领姿势异常'));
  g.adventureCamera.yaw=Math.atan2(boss.x-g.player.x,boss.z-g.player.z);g.adventureCamera.pitch=.07;step(4);
  const time=g.time,phase=boss.mesh.userData.phase;g.pause();step(30);assert(g.time===time&&boss.mesh.userData.phase===phase,'暂停后仍然迈步');g.resume();step(1);
  $('#status').textContent='实战动作检查 PASS（正常 AI，测试玩家无敌且不自动攻击） · '+JSON.stringify({frames,boss:boss.kind,bossMoved:Math.hypot(boss.x-bossStart.x,boss.z-bossStart.z),creatures:tracked.map(({e,x,z})=>({kind:e.kind,moved:Math.hypot(e.x-x,e.z-z),wind:e.wind})),width:win.innerWidth,height:win.innerHeight,...reportFrame()});
 }catch(error){$('#status').textContent='实战动作检查 FAIL · '+String(error);}finally{motionButton.disabled=false;}
};

$('#ruins').onclick=async()=>{if(!['forest','confluence'].includes($('#map').value))$('#map').value='forest';await preview(true);const a=g.world.forestVista?.gateCenter||g.world.forestVista?.anchors?.[0];if(!a){$('#status').textContent='当前地形没有可用古迹锚点';return;}let p={x:a.x,z:a.z+5};for(const dz of [5,6,7,-5,-6])if(g.world.obstacles.every(o=>Math.hypot(a.x-o.x,a.z+dz-o.z)>o.r+.7)){p={x:a.x,z:a.z+dz};break;}g.player.x=p.x;g.player.z=p.z;step(90);$('#status').textContent='林中古迹实景 · '+JSON.stringify({columns:g.world.forestVista.columns,arches:g.world.forestVista.arches,triangles:g.world.forestVista.triangles,drawCalls:g.world.forestVista.drawCalls,anchors:g.world.forestVista.anchors});};

for(const variant of ['cache','trail'])$('#'+variant).onclick=async()=>{await preview(true);const n=g.world.discoveries.find(n=>n.variant===variant);if(!n){$('#status').textContent='此种子没有可用的 '+variant;return;}n.availableAt=0;g.player.x=n.x;g.player.z=n.z+3.8;g.adventureCamera.yaw=Math.PI;g.adventureCamera.pitch=-.35;g.adventureCamera._ready=false;step(30);$('#status').textContent='实际探索景物 · '+JSON.stringify({biome:n.id,variant:n.variant,position:{x:n.x,z:n.z},nodes:n.nodes,...reportFrame()});};
$('#gpu').onclick=async()=>{
 $('#gpu').disabled=true;await load(false,2560,1440);select('forest','silver',true);g.pause();const gl=g.renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2'),target=g.cinema.sceneTarget;
 try{if(!ext||!target?.samples){$('#status').textContent='当前浏览器不支持 GPU 耗时对照';return;}
  const draw=()=>g.cinema.render(()=>g.renderer.render(g.hero.parent,g.camera),1),measure=async old=>{target.resolveDepthBuffer=old;const q=gl.createQuery();gl.beginQuery(ext.TIME_ELAPSED_EXT,q);draw();gl.endQuery(ext.TIME_ELAPSED_EXT);gl.flush();for(let i=0;i<300&&!gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE);i++)await sleep(10);const ready=gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE),disjoint=gl.getParameter(ext.GPU_DISJOINT_EXT),ms=ready&&!disjoint?gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6:null;gl.deleteQuery(q);return ms;};
  for(let i=0;i<5;i++)draw();gl.finish();const old=[],current=[];for(let cycle=0;cycle<4;cycle++)for(const mode of (cycle%2?[false,true]:[true,false])){const value=await measure(mode);if(value!==null)(mode?old:current).push(value);}
  const median=a=>{const b=[...a].sort((a,b)=>a-b);return b.length?(b[Math.floor((b.length-1)/2)]+b[Math.ceil((b.length-1)/2)])/2:null;};$('#status').textContent='同机位 GPU 单帧对照（非真机游戏 FPS） · '+JSON.stringify({old,current,oldMedianMs:median(old),currentMedianMs:median(current),...reportFrame()});
 }finally{if(target)target.resolveDepthBuffer=false;$('#gpu').disabled=false;}
};
